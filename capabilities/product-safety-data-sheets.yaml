naftiko: 1.0.0-alpha2
info:
  label: Sigma-Aldrich Product Search API — Safety Data Sheets
  description: 'Sigma-Aldrich Product Search API — Safety Data Sheets. 1 operations. Lead operation: Get Safety Data Sheet.
    Self-contained Naftiko capability covering one Sigma Aldrich business surface.'
  tags:
  - Sigma Aldrich
  - Safety Data Sheets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SIGMA_ALDRICH_API_KEY: SIGMA_ALDRICH_API_KEY
capability:
  consumes:
  - type: http
    namespace: product-safety-data-sheets
    baseUri: https://api.sigmaaldrich.com/v1
    description: Sigma-Aldrich Product Search API — Safety Data Sheets business capability. Self-contained, no shared references.
    resources:
    - name: products-catalogNumber-sds
      path: /products/{catalogNumber}/sds
      operations:
      - name: getproductsds
        method: GET
        description: Get Safety Data Sheet
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: language
          in: query
          type: string
          description: Language code for the SDS (e.g., en-US, de-DE, fr-FR, zh-CN)
        - name: format
          in: query
          type: string
          description: Response format — structured JSON or PDF download URL
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.SIGMA_ALDRICH_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: product-safety-data-sheets-rest
    port: 8080
    description: REST adapter for Sigma-Aldrich Product Search API — Safety Data Sheets. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/products/{catalognumber}/sds
      name: products-catalognumber-sds
      description: REST surface for products-catalogNumber-sds.
      operations:
      - method: GET
        name: getproductsds
        description: Get Safety Data Sheet
        call: product-safety-data-sheets.getproductsds
        with:
          language: rest.language
          format: rest.format
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: product-safety-data-sheets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Sigma-Aldrich Product Search API — Safety Data Sheets. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-safety-data-sheet
      description: Get Safety Data Sheet
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: product-safety-data-sheets.getproductsds
      with:
        language: tools.language
        format: tools.format
      outputParameters:
      - type: object
        mapping: $.
