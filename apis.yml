apis:
- aid: sigma-aldrich:sigma-aldrich-structure-search-api
  name: Sigma-Aldrich Chemical Structure Search API
  tags:
  - Chemistry
  - Cheminformatics
  - Structure Search
  - SMILES
  humanURL: https://www.sigmaaldrich.com/US/en/support/contact-us
  properties:
  - url: https://www.sigmaaldrich.com/US/en/support/contact-us
    type: Documentation
  description: >-
    The Sigma-Aldrich Chemical Structure Search API enables substructure, exact structure, and similarity
    searches against the Sigma-Aldrich chemical catalog using SMILES, InChI, or molecular formula notation.
    Supports configuring similarity thresholds and returning ranked results for drug discovery, materials
    research, and synthetic chemistry workflows.
- aid: sigma-aldrich:sigma-aldrich-sds-api
  name: Sigma-Aldrich Safety Data Sheet API
  tags:
  - Safety
  - SDS
  - GHS
  - Compliance
  humanURL: https://www.sigmaaldrich.com/US/en/support/sds-portal
  properties:
  - url: https://www.sigmaaldrich.com/US/en/support/sds-portal
    type: Documentation
  description: >-
    The Safety Data Sheet (SDS) API provides programmatic access to GHS- compliant Safety Data Sheets
    for all Sigma-Aldrich chemical products. Enables EHS systems, LIMS platforms, and safety management
    software to retrieve current SDSs in multiple languages and formats for regulatory compliance and
    laboratory safety management.
